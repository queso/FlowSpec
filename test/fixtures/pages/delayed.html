<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delayed Content</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 1rem;
    }
    #delayed-content {
      margin-top: 1rem;
      padding: 1rem;
      background: #e6ffe6;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Loading Page</h1>
  <p>Please wait while content loads...</p>

  <div id="delayed-container"></div>

  <script>
    setTimeout(() => {
      const container = document.getElementById('delayed-container');
      const content = document.createElement('div');
      content.id = 'delayed-content';
      content.textContent = 'Delayed Content Loaded';
      container.appendChild(content);
    }, 3000);
  </script>
</body>
</html>

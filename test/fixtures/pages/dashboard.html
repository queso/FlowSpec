<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: #333;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav {
      display: flex;
      gap: 1rem;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      padding: 2rem;
    }
    .welcome {
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .content {
      display: grid;
      gap: 1rem;
    }
    .card {
      background: #f5f5f5;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    .card h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>Dashboard</h1>
    <nav>
      <a href="/dashboard">Home</a>
      <a href="/settings">Settings</a>
      <a href="/profile">Profile</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <main>
    <p class="welcome">Welcome back, User!</p>

    <section class="content">
      <article class="card">
        <h3>Recent Activity</h3>
        <p>You have 5 new notifications.</p>
      </article>

      <article class="card">
        <h3>Quick Stats</h3>
        <p>Projects: 12</p>
        <p>Tasks: 48</p>
      </article>

      <article class="card">
        <h3>Updates</h3>
        <p>System updated successfully.</p>
      </article>
    </section>
  </main>
</body>
</html>

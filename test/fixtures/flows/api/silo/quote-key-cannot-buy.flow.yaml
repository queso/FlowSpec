name: quote-key-cannot-buy
description: |
  A key scoped to quoting gets 403 on a real buy, and the platform is never
  called.
surface: api
steps:
  - request: {post: "{env.PLATFORM_FAKE_URL}/__reset"}
    expect:
      - status: 200
  - request:
      post: /tiktok/arcane/labels
      headers:
        Authorization: "Bearer {env.PORTER_QUOTE_KEY}"
        Idempotency-Key: e2e-forbidden-1
      json: {orderIds: ["576002"], weight: {value: "1.2", unit: "LB"}}
    expect:
      - status: 403
      - json: {path: "$.missingScope", equals: "labels:buy"}
  - request: {get: "{env.PLATFORM_FAKE_URL}/__calls?path=/fulfillment/202309/packages"}
expect:
  - json: {path: "$.count", equals: 0}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Must be >= 1.2 to parse the text bun.lock format. Older versions
          # fail with "Unknown lockfile version", ignore the lockfile, and
          # silently resolve every range to latest — which defeats pinning.
          bun-version: "1.3.11"

      - name: Install dependencies
        # Fail loudly if the lockfile and package.json disagree, rather than
        # quietly installing something other than what was committed.
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx agent-browser install --with-deps

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test
